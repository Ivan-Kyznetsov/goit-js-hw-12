<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GALLERY</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="container">
      <form class="form">
        <label>
          <input
            type="text"
            name="search-text"
            placeholder="Search images..."
            required
          />
        </label>
        <button type="submit">Search</button>
      </form>
      <ul class="gallery"></ul>
      <button class="btn-load-more is-hidden" type="button">Load more</button>
      <p class="loader is-hidden">
        Loading images, please wait...<span class="loader-loading"></span>
      </p>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
